# QA 2026-10 성능(QA-400) 측정 전용 덧붙임: 격리 스택 A 의 api 에만 JVM 옵션을 덧붙인다. 운영 · 제품 설정이 아니다(측정이 끝나면 이 파일 없이 다시 만든다).
# 이미지의 옵션(apps/api/Dockerfile 의 JAVA_TOOL_OPTIONS)을 그대로 앞에 두고 QA_JVM_EXTRA 를 뒤에 붙인다 — 같은 -XX 옵션은 뒤의 값이 이긴다
# (예: -XX:MaxRAMPercentage=30 이 이미지의 40 을 대신한다). QA_JVM_EXTRA 가 비면 이미지와 같은 옵션이다.
#   QA_JVM_EXTRA="-XX:MaxRAMPercentage=30 -XX:G1PeriodicGCInterval=30000" <스택 A 환경 변수> docker compose -p wakeline-e2e \
#     -f infra/compose.yml -f tools/qa/compose.qa-fix.yml -f tools/qa/compose.qa-jvm.yml --env-file .env up -d --no-build --no-deps --wait api
# 한 번의 측정은 tools/qa/perf_jvm_run.sh 가 이 파일로 api 를 다시 만들고 부하 단계를 차례로 돈다.
services:
  api:
    environment:
      JAVA_TOOL_OPTIONS: "-XX:+UseG1GC -XX:MaxRAMPercentage=40 -XX:+ExitOnOutOfMemoryError ${QA_JVM_EXTRA:-}"
