# 매주 의존성 갱신 PR (NFR-10 · SEC-8). 보안 업데이트는 Dependabot security updates 가 주기와 무관하게 연다.
# 부 버전·패치는 생태계별로 한 PR 에 묶어 소음을 줄이고, 주 버전은 따로 연다(깨지는 변경을 개별 검토).
# cooldown: 버전 갱신은 공개 뒤 7일을 기다린다(공급망 — 막 올라온 악성·깨진 릴리스를 바로 들이지 않게). 보안 갱신에는 걸리지 않는다(GitHub 문서).
version: 2
updates:
  - package-ecosystem: npm
    directory: /apps/web
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Asia/Seoul }
    open-pull-requests-limit: 10
    cooldown: { default-days: 7 }
    groups:
      web-minor-patch: { update-types: [minor, patch] }
    # 주 버전은 호환을 확인하는 계획된 작업으로 올린다(PR 을 열지 않는다 — 부 · 패치와 보안 갱신은 그대로 온다). 2026-10-02 첫 PR 들이 CI 에서 깨졌다:
    # ESLint 10 은 eslint-config-next 가 아직 받지 않는다(CTO 리뷰 2026-10 결정 7 — 2026-10-03 다시 봄: 묶인 eslint-plugin-import 2.32 · jsx-a11y 6.10 · react 7.37 의
    # 최신판도 peer 가 ESLint ≤ 9) · TypeScript 는 6.0 까지 올렸고(2026-10-03) 7(새 컴파일러 — JS API 없음)은 typescript-eslint 가 받을 때(peer < 6.1) ·
    # @types/node 는 실행 Node(24)와 맞춘다 — Node 26 이 LTS 가 된 뒤(2026-10 말 예정) 웹 이미지와 함께
    ignore:
      - { dependency-name: "eslint", update-types: ["version-update:semver-major"] }
      - { dependency-name: "typescript", update-types: ["version-update:semver-major"] }
      - { dependency-name: "@types/node", update-types: ["version-update:semver-major"] }

  - package-ecosystem: uv
    directory: /apps/collector
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Asia/Seoul }
    open-pull-requests-limit: 10
    cooldown: { default-days: 7 }
    groups:
      collector-minor-patch: { update-types: [minor, patch] }

  - package-ecosystem: gradle
    directory: /apps/api
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Asia/Seoul }
    open-pull-requests-limit: 10
    cooldown: { default-days: 7 }
    groups:
      api-minor-patch: { update-types: [minor, patch] }
    # json-schema-validator 3.x 는 API 가 바뀐 주 버전 — 스트림 검증(SchemaValidator)을 옮기는 계획된 작업으로
    ignore:
      - { dependency-name: "com.networknt:json-schema-validator", update-types: ["version-update:semver-major"] }

  # 각 앱 Dockerfile 의 기반 이미지 · db(infra/db — 공식 postgres 다이제스트, R-63)
  - package-ecosystem: docker
    directories: [/apps/api, /apps/web, /apps/collector, /infra/db, /infra/edge]
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Asia/Seoul }
    open-pull-requests-limit: 10
    cooldown: { default-days: 7 }
    # web 의 Node 주 버전(24 → 26)은 첫 화면 JS 예산(웹 이미지의 Node 로 잰다 — ADR-026) · 런타임을 함께 재는 계획된 작업으로. 같은 주 버전의 새 다이제스트는 그대로 온다
    ignore:
      - { dependency-name: "node", update-types: ["version-update:semver-major"] }

  # infra/compose.yml 의 제3자 이미지(태그@다이제스트 고정 — 같은 태그의 새 다이제스트도 PR 로 온다)
  - package-ecosystem: docker-compose
    directory: /infra
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Asia/Seoul }
    open-pull-requests-limit: 10
    cooldown: { default-days: 7 }

  # 워크플로의 액션(커밋 SHA 고정 + 버전 주석을 함께 갱신)
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Asia/Seoul }
    open-pull-requests-limit: 10
    cooldown: { default-days: 7 }
    groups:
      actions: { patterns: ["*"] }
