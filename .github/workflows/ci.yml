name: ci
on: { push: { branches: [main] }, pull_request: {} }
permissions: { contents: read, security-events: write }
jobs:
  collector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
        working-directory: apps/collector
      - run: uv run ruff check . && uv run ruff format --check .
        working-directory: apps/collector
      - run: uv run pytest -q --cov=skywx_collector --cov-report=term-missing
        working-directory: apps/collector
      - run: uv run python ../../tools/contract_check.py
        working-directory: apps/collector
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "25" }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon test
        working-directory: apps/api
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: api-test-report, path: apps/api/build/reports/tests }
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
        working-directory: apps/web
      - run: npx eslint . && npx tsc --noEmit && npx vitest run && npm run build
        working-directory: apps/web
      - run: npm audit --audit-level=high
        working-directory: apps/web
  e2e:
    runs-on: ubuntu-latest
    needs: [collector, api, web]
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/init_env.py && sed -i 's/^SKYWX_FIXTURE_MODE=0/SKYWX_FIXTURE_MODE=1/' .env
      - run: docker compose -f infra/compose.yml --env-file .env up -d --build --wait
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci && npx playwright install --with-deps chromium && npx playwright test
        working-directory: apps/web
      - run: docker compose -f infra/compose.yml --env-file .env logs --tail=100
        if: failure()
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - run: python3 tools/init_env.py && docker compose -f infra/compose.yml --env-file .env build api collector web
      - uses: aquasecurity/trivy-action@0.28.0
        with: { image-ref: skywx-api, severity: "HIGH,CRITICAL", exit-code: "1", ignore-unfixed: true }
      - uses: aquasecurity/trivy-action@0.28.0
        with: { image-ref: skywx-collector, severity: "HIGH,CRITICAL", exit-code: "1", ignore-unfixed: true }
      - uses: aquasecurity/trivy-action@0.28.0
        with: { image-ref: skywx-web, severity: "HIGH,CRITICAL", exit-code: "1", ignore-unfixed: true }
  codeql:
    runs-on: ubuntu-latest
    strategy: { matrix: { language: [java-kotlin, javascript-typescript, python] } }
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with: { languages: "${{ matrix.language }}" }
      - uses: actions/setup-java@v4
        if: matrix.language == 'java-kotlin'
        with: { distribution: temurin, java-version: "25" }
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3
