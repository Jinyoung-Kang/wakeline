spring:
  application.name: wakeline-api
  threads.virtual.enabled: true
  main.banner-mode: off
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:wakeline}
    username: wakeline_api
    password: ${DB_API_PASSWORD:}
    hikari:
      maximum-pool-size: 12
      connection-timeout: 5000
      data-source-properties:
        ApplicationName: wakeline-api
        reWriteBatchedInserts: true      # 항적 배치(2,000행)를 다중 VALUES INSERT 로 — 왕복 수를 줄인다
        # 격벽(R-62 · ADR-017 §2): 모든 문장 30 s · 잠금 대기 5 s 상한(파티션 DROP 이 부모 잠금을 기다리며 INSERT 를 줄줄이 막지 않게).
        # 공개 조회는 문장마다 3 s(Sql.PUBLIC_READ_TIMEOUT_S). 되돌리기: 이 줄을 지운다.
        options: "-c statement_timeout=30s -c lock_timeout=5s"
  flyway:
    # 스키마 변경은 compose 의 migrate 서비스(--migrate)만 한다 — 그 프로세스가 DB_MIGRATOR_PASSWORD 를 직접 읽는다(WakelineApplication).
    # api 는 DML 전용 계정(wakeline_api)만 가지며 DDL 비밀번호를 받지도, 참조하지도 않는다(최소 권한, SEC-3).
    enabled: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}         # 계약 §6: ACL 사용자 wakeline_api (비어 있으면 default 사용자)
      password: ${REDIS_PASSWORD:}
      timeout: 3s
  web.error:                            # Boot 4: server.error.* → spring.web.error.* (예전 키는 바인딩되지 않는다)
    include-message: never
    include-stacktrace: never
  lifecycle:
    # 종료 단계별 대기 상한(스트림 소비 중지 → WS going_away → 항적·알림 flush → Tomcat). compose stop_grace_period 30 s 안에 끝난다.
    timeout-per-shutdown-phase: 10s
  session:
    # Boot 4 에서 spring.session.redis.* 는 더 이상 바인딩되지 않는다(→ spring.session.data.redis.*). 예전 키로는 세션이 기본
    # 이름공간 spring:session:* 에 저장되어 Redis ACL(wakeline_api: ~wakeline:* ~rl:*)이 거부했다(NOPERM → 로그인 500).
    data.redis.namespace: wakeline:session
    # 유휴 기준(요청마다 연장). 절대 수명은 wakeline.ops-session-max-age(R-54)
    timeout: ${WAKELINE_OPS_SESSION_TTL_H:8}h

server:
  port: 8000
  shutdown: graceful
  forward-headers-strategy: none        # XFF 는 TrustedProxyFilter 가 edge 에 한해 해석한다
  tomcat.max-http-form-post-size: 64KB
  max-http-request-header-size: 16KB

management:
  server.port: ${MANAGEMENT_SERVER_PORT:9000}
  endpoints.web.exposure.include: health,prometheus,info
  endpoint.health.probes.enabled: true
  endpoint.health.show-details: never
  # 수집 경로(REL-20): 자기 그룹에만 — readiness·liveness 에 넣지 않는다(수집기 장애로 api 를 재시작·차단하지 않게). /actuator/health/ingest
  endpoint.health.group.ingest.include: ingestPipeline
  health.redis.enabled: true
  health.db.enabled: true

springdoc:
  api-docs.path: /api/v1/openapi
  swagger-ui.enabled: false
  # 공개 문서에서 운영 API 를 뺀다(R-89, ADR-017 §1) — 익명 /api/v1/ops/** 는 404 로 존재를 숨긴다
  paths-to-exclude: /api/v1/ops/**

wakeline:
  trusted-proxy: ${WAKELINE_TRUSTED_PROXY:}
  # 운영 세션 절대 수명(R-54, ADR-017 §3): 로그인 시각부터 — 폴링이 유휴 한도를 계속 연장해도 이 시간이 지나면 다시 로그인한다
  ops-session-max-age: 8h
  # 세션·CSRF 쿠키 Secure(R-90). 기본 false(127.0.0.1 평문 HTTP). HTTPS 로 노출할 때만 true — edge 에 TLS·HSTS 가 먼저 있어야 한다
  cookie-secure: ${WAKELINE_COOKIE_SECURE:false}
  # 관심 지역의 기본값(.env). 실제로 쓰는 값은 런타임 설정(app_setting → Redis wakeline:settings, collector 와 같은 값)이다.
  # 운영자가 /ops 에서 바꾼 적이 없으면 기동 시 이 값으로 런타임 설정을 맞춘다(COR-12).
  region-center: ${WAKELINE_REGION_CENTER:36.5,127.8}
  region-radius-nm: ${WAKELINE_REGION_RADIUS_NM:250}
  public-rate-limit-per-min: ${WAKELINE_PUBLIC_RATE_LIMIT_PER_MIN:120}
  ws-max-conn: ${WAKELINE_WS_MAX_CONN:200}
  ws-max-conn-per-ip: ${WAKELINE_WS_MAX_CONN_PER_IP:5}
  ws-diff-interval-s: 10
  ws-resync-interval-s: 30
  ws-resync-world-interval-s: 120        # 줌 ≤ 5(전세계) 세션의 주기 전체 스냅샷(계약 §1)
  allowed-origins: ${WAKELINE_ALLOWED_ORIGINS:http://localhost:8700,http://127.0.0.1:8700}   # WS Origin 명시 허용 목록(쉼표 구분)
  max-bbox-area-sqdeg: 2500
  fixture-mode: ${WAKELINE_FIXTURE_MODE:0}
  schemas-dir: ${WAKELINE_SCHEMAS_DIR:classpath:schemas}
  track-retention-hours: 72
  alert-retention-days: ${WAKELINE_ALERT_RETENTION_DAYS:30}   # 끝난 알림 보존(일, R-06 · ADR-017 §2). 0 = 지우지 않음
  summary-retention-days: 30
  logs:
    # 시스템 로그 싱크(계약 v5 §C2, ADR-018): 이 프로세스의 WARN·ERROR 와 브라우저 오류를 가려서 Redis 스트림 wakeline:logs 로.
    # 되돌리기: false — logback 에 붙지 않고 스트림에 쓰지 않는다(브라우저 오류 수집은 503). 조회(/api/v1/ops/logs)는 그대로 남은 항목을 읽는다.
    sink-enabled: ${WAKELINE_LOG_SINK_ENABLED:true}

logging:
  level:
    root: INFO
    dev.wakeline: INFO
    org.springframework.security: WARN
  # 요청 중의 로그 줄에 요청 id(MDC request_id — edge 가 보낸 id 면 그 값, R-49)를 [rid:…] 로 붙인다. 요청 밖(스케줄·소비 스레드)은 붙이지 않는다.
  pattern.correlation: "%replace([rid:%X{request_id}] ){'\\[rid:\\] ', ''}"
