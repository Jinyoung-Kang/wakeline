spring:
  application.name: skywx-api
  threads.virtual.enabled: true
  main.banner-mode: off
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:skywx}
    username: skywx_api
    password: ${DB_API_PASSWORD:}
    hikari:
      maximum-pool-size: 12
      connection-timeout: 5000
      data-source-properties:
        ApplicationName: skywx-api
  flyway:
    # 스키마 변경은 compose 의 migrate 서비스(--migrate)만 한다. api 는 DML 전용 계정만 가진다(최소 권한).
    enabled: false
    user: skywx_migrator
    password: ${DB_MIGRATOR_PASSWORD:}
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3s
  session:
    redis.namespace: skywx:session
    timeout: ${SKYWX_OPS_SESSION_TTL_H:8}h

server:
  port: 8000
  shutdown: graceful
  forward-headers-strategy: none        # XFF 는 TrustedProxyFilter 가 edge 에 한해 해석한다
  error.include-message: never
  error.include-stacktrace: never
  tomcat.max-http-form-post-size: 64KB
  max-http-request-header-size: 16KB

management:
  server.port: ${MANAGEMENT_SERVER_PORT:9000}
  endpoints.web.exposure.include: health,prometheus,info
  endpoint.health.probes.enabled: true
  endpoint.health.show-details: never
  health.redis.enabled: true
  health.db.enabled: true

springdoc:
  api-docs.path: /api/v1/openapi
  swagger-ui.enabled: false

skywx:
  trusted-proxy: ${SKYWX_TRUSTED_PROXY:}
  region-center: ${SKYWX_REGION_CENTER:36.5,127.8}
  region-radius-nm: ${SKYWX_REGION_RADIUS_NM:250}
  public-rate-limit-per-min: ${SKYWX_PUBLIC_RATE_LIMIT_PER_MIN:120}
  ws-max-conn: ${SKYWX_WS_MAX_CONN:200}
  ws-max-conn-per-ip: ${SKYWX_WS_MAX_CONN_PER_IP:5}
  ws-diff-interval-s: 10
  ws-resync-interval-s: 30
  max-bbox-area-sqdeg: 2500
  fixture-mode: ${SKYWX_FIXTURE_MODE:0}
  schemas-dir: ${SKYWX_SCHEMAS_DIR:classpath:schemas}
  track-retention-hours: 72
  summary-retention-days: 30

logging:
  level:
    root: INFO
    dev.skywx: INFO
    org.springframework.security: WARN
