[project]
name = "wakeline-collector"
version = "0.2.0"
description = "Wakeline collector — 외부 공급자 수집·정규화·품질 게이트·원천 보관·예산·Redis Streams 발행"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "redis>=6.2",
    "asyncpg>=0.30",
    "shapely>=2.1",
    "jsonschema>=4.25",
    "orjson>=3.11",
    "numpy>=2.3",
    "pyproj>=3.7",
    "pillow>=11.3",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.1",
    "pytest-cov>=6.2",
    "respx>=0.22",
    "ruff>=0.13",
    "mypy>=1.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wakeline_collector"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "ASYNC"]

[tool.mypy]
python_version = "3.13"
strict = false
ignore_missing_imports = true
