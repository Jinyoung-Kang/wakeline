# SkyWx redis — 스트림·예산·세션·짧은 캐시. 내부 네트워크 전용.
bind 0.0.0.0
protected-mode yes
port 6379
appendonly yes
appendfsync everysec
save ""
maxmemory 256mb
# 스트림·예산·세션이 캐시와 같은 인스턴스에 있으므로 LRU 로 지우지 않는다. 스트림은 MAXLEN, 캐시는 TTL 로 크기를 제한한다.
maxmemory-policy noeviction
# 위험 명령 비활성화
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command CONFIG ""
rename-command DEBUG ""
rename-command SHUTDOWN ""
