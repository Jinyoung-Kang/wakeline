# Wakeline 로컬 스택 — 상시 7 컨테이너(edge·web·api·collector·ais·redis·db) + 일회성 migrate. 공개 포트는 edge(127.0.0.1:${WAKELINE_PORT:-8700}) 하나뿐이다.
# 같은 파일로 격리된 E2E·데모 스택도 띄운다: -p wakeline-e2e, WAKELINE_PORT=8701, WAKELINE_NET_PREFIX=10.78.0 (Makefile e2e/demo).
# 프로젝트가 다르면 컨테이너·볼륨·네트워크가 분리되어 개발 DB 에 fixture 데이터가 섞이지 않는다.
#
# 컨테이너 권한(SEC-4): 모든 컨테이너가 no-new-privileges 이고 cap_drop ALL 이다. db 를 뺀 전부가 비root·read-only 루트 FS 다.
#   db 만 엔트리포인트가 데이터 디렉터리 소유권을 맞춘 뒤 postgres(999)로 내려가므로 그 5개 권한(CHOWN·DAC_OVERRIDE·FOWNER·SETGID·SETUID)을 남긴다
#   — postgres 프로세스 자체는 권한 0 으로 돈다(infra/tests/db_hardening_test.sh).
# 제3자 이미지는 태그+다이제스트로 고정한다(Dependabot docker-compose 가 매주 갱신 PR).
# Redis 는 서비스별 ACL 사용자(계약 §6 · v2 §C, infra/redis/start.sh)로 접속한다 — api·collector·ais 는 관리용 default 비밀번호를 모른다.
# 외부 키는 그것을 쓰는 컨테이너에만 들어간다: OpenSky·기상청 → collector, aisstream.io(.env 의 aisstream_key) → ais.
# 격리 스택(Makefile ISO_ENV)은 외부 키를 빈 값으로 덮어써 fixture 재생만 한다.
name: wakeline

# 컨테이너 로그 상한(json-file 회전). Docker 기본값은 무제한이라 AIS 처럼 오래 도는 수신기가 디스크를 채울 수 있다.
x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

x-hardened: &hardened
  read_only: true
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  logging: *logging

# collector 와 ais 가 같은 이미지를 쓴다(진입점만 다름, ADR-014). 빌드 정의는 한 곳에.
x-collector-build: &collector_build
  context: ..
  dockerfile: apps/collector/Dockerfile

services:
  edge:
    # 비root nginx(uid 101). 1.27 계열은 2025-06 이후 재빌드가 없어 현재 stable(1.30) 을 쓴다.
    image: nginxinc/nginx-unprivileged:1.30-alpine@sha256:ed04ec1ff34502c339ee5c3ae3f855442398edc1d05591e2b98981dcbbd20b1e
    <<: *hardened
    user: "101:101"
    tmpfs: ["/tmp:size=64m"]                        # pid · 프록시 임시 파일(nginx.conf)
    ports: ["127.0.0.1:${WAKELINE_PORT:-8700}:8700"]   # 8080 은 SmartCollab 이 사용 — Wakeline 는 8700(E2E 8701)
    environment:
      NGINX_ENTRYPOINT_QUIET_LOGS: "1"
    volumes:
      - ./edge/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./edge/proxy_headers.conf:/etc/nginx/proxy_headers.conf:ro
      - ./edge/security_headers.conf:/etc/nginx/security_headers.conf:ro
    depends_on:
      web: { condition: service_healthy }
      api: { condition: service_healthy }
    deploy:
      resources:
        limits: { memory: 256m, pids: 256 }
    networks:
      public: {}                                   # 게시 포트(127.0.0.1) 경로 — edge 만 붙는다
      wakeline: { ipv4_address: "${WAKELINE_NET_PREFIX:-10.77.0}.10" }
    healthcheck:
      # Host 허용 목록(nginx.conf)에 127.0.0.1 이 있으므로 421 이 아니라 api 의 /healthz 까지 간다
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8700/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6

  web:
    image: wakeline-web:local
    build: ../apps/web
    <<: *hardened
    tmpfs: ["/tmp"]
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      API_INTERNAL_URL: http://api:8000       # `next dev` 의 rewrite 에서만 쓴다(next.config.ts) — 운영 빌드는 edge 가 /api 를 api 로 보낸다. NEXT_PUBLIC_ 변수는 없다(R-50).
    expose: ["3000"]
    deploy:
      resources:
        limits: { memory: 512m, pids: 256 }
    networks:
      wakeline: { ipv4_address: "${WAKELINE_NET_PREFIX:-10.77.0}.20" }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 10

  migrate:
    # Flyway 를 한 번 실행하고 끝난다. DDL 권한 비밀번호(DB_MIGRATOR_PASSWORD)는 이 컨테이너에만 주입한다.
    # --migrate 는 Spring 없이 Flyway 만 돌리고 DB_HOST·DB_PORT·DB_NAME·DB_MIGRATOR_USER·DB_MIGRATOR_PASSWORD 만 읽는다
    # (WakelineApplication.migrate) — api DB 비밀번호·Redis 자격증명은 주지 않고 Redis 를 기다리지도 않는다(SEC-R2).
    image: wakeline-api:local
    build: ../apps/api
    <<: *hardened
    restart: "no"
    tmpfs: ["/tmp"]
    command: ["--migrate"]
    environment:
      TZ: UTC
      DB_HOST: db
      DB_NAME: wakeline
      DB_MIGRATOR_PASSWORD: ${DB_MIGRATOR_PASSWORD:?DB_MIGRATOR_PASSWORD 가 .env 에 없습니다 — make init}
    depends_on:
      db: { condition: service_healthy }
    networks:
      wakeline: {}

  api:
    image: wakeline-api:local
    build: ../apps/api
    <<: *hardened
    init: true                                   # PID 1 = docker-init(tini): 신호 전달·좀비 회수. 앱이 죽으면 컨테이너도 끝나 재시작 정책이 동작한다
    tmpfs: ["/tmp"]
    # 종료 순서(소비 중지 → 트랙 flush → WS going_away)가 끝나도록 docker 기본 10 s 대신 30 s 를 준다(REL-15)
    stop_grace_period: 30s
    environment:
      TZ: UTC
      SPRING_THREADS_VIRTUAL_ENABLED: "true"
      MANAGEMENT_SERVER_PORT: "9000"
      DB_HOST: db
      DB_NAME: wakeline
      DB_API_PASSWORD: ${DB_API_PASSWORD:?DB_API_PASSWORD 가 .env 에 없습니다 — make init}
      REDIS_HOST: redis
      REDIS_USERNAME: wakeline_api                 # 계약 §6: 키 wakeline:* · rl:* 만, 위험 명령 없음
      REDIS_PASSWORD: ${REDIS_API_PASSWORD:?REDIS_API_PASSWORD 가 .env 에 없습니다 — make init}
      WAKELINE_TRUSTED_PROXY: ${WAKELINE_NET_PREFIX:-10.77.0}.10   # edge 만 X-Forwarded-For 를 말할 수 있다
      # WebSocket Origin 허용 목록(계약 §1). Host 에서 유도하지 않는다 — DNS rebinding 방어(SEC-7). 격리 스택은 WAKELINE_PORT=8701 로 맞춰진다.
      WAKELINE_ALLOWED_ORIGINS: http://localhost:${WAKELINE_PORT:-8700},http://127.0.0.1:${WAKELINE_PORT:-8700}
      # 개발 전용 opt-in(기본 비어 있음): 화면을 스택 밖 주소로 띄울 때(예: `next dev` 면 .env 에 EXTRA_ALLOWED_ORIGINS=http://localhost:3000) 위 목록 뒤에
      # 붙는다 — WS 핸드셰이크 · 운영 변경 요청의 출처 검사가 같은 목록을 쓴다(AppProperties.originPatterns). 같은 .env 를 읽는 격리 스택에도 간다.
      WAKELINE_EXTRA_ALLOWED_ORIGINS: ${EXTRA_ALLOWED_ORIGINS:-}
      WAKELINE_REGION_CENTER: ${REGION_CENTER:-36.5,127.8}
      WAKELINE_REGION_RADIUS_NM: ${REGION_RADIUS_NM:-250}
      WAKELINE_OPS_SESSION_TTL_H: ${OPS_SESSION_TTL_H:-8}
      WAKELINE_COOKIE_SECURE: ${COOKIE_SECURE:-false}          # HTTPS 뒤에 둘 때 true(R-90). 로컬 http 에서 true 면 브라우저가 쿠키를 버린다
      WAKELINE_ALERT_RETENTION_DAYS: ${ALERT_RETENTION_DAYS:-30}   # 끝난 알림 보존 일수(R-06), 0 = 지우지 않음
      WAKELINE_PUBLIC_RATE_LIMIT_PER_MIN: ${PUBLIC_RATE_LIMIT_PER_MIN:-120}
      WAKELINE_WS_MAX_CONN: ${WS_MAX_CONN:-200}
      WAKELINE_WS_MAX_CONN_PER_IP: ${WS_MAX_CONN_PER_IP:-5}
      WAKELINE_FIXTURE_MODE: ${WAKELINE_FIXTURE_MODE:-0}
    expose: ["8000", "9000"]
    depends_on:
      redis: { condition: service_healthy }
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    deploy:
      resources:
        limits: { memory: 1g, pids: 1024 }
    networks:
      wakeline: { ipv4_address: "${WAKELINE_NET_PREFIX:-10.77.0}.30" }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s

  collector:
    image: wakeline-collector:local
    build: *collector_build
    <<: *hardened
    init: true                                   # api 와 같은 이유(ais 도 같다)
    # SIGTERM 뒤 진행 중 작업 18 s + DB 큐 비우기·풀 닫기 각 4 s ≈ 26 s(main.py) — 기본 10 s 면 SIGKILL 로 잘린다(COL-4)
    stop_grace_period: 30s
    tmpfs: ["/tmp"]
    # 최소 권한: .env 전체(env_file)를 넘기지 않고 collector 가 쓰는 값만 명시한다.
    # DB root·마이그레이터 비밀번호, 운영자 초기 비밀번호는 이 컨테이너에 들어오지 않는다. 외부 키는 이 컨테이너에만 들어간다.
    environment:
      TZ: UTC
      DB_HOST: db
      DB_NAME: wakeline
      DB_COLLECTOR_PASSWORD: ${DB_COLLECTOR_PASSWORD:?DB_COLLECTOR_PASSWORD 가 .env 에 없습니다 — make init}
      REDIS_HOST: redis
      REDIS_USERNAME: wakeline_collector           # 계약 §6: 수집기 키만, 세션·요청 제한·DLQ 접근 불가, 설정은 읽기 전용
      REDIS_PASSWORD: ${REDIS_COLLECTOR_PASSWORD:?REDIS_COLLECTOR_PASSWORD 가 .env 에 없습니다 — make init}
      OPENSKY_CLIENT_ID: ${OPENSKY_CLIENT_ID:-}
      OPENSKY_CLIENT_SECRET: ${OPENSKY_CLIENT_SECRET:-}
      KMA_APIHUB_KEY: ${KMA_APIHUB_KEY:-}
      # 기상청 API허브 호스트 요청 속도(req/s) — 고른 값 0.5 · 상한 1.0(계약 v5 §G24 · ADR-011 개정 2026-09-30). 넘기지 않으면 .env 값이 수집기에 닿지 않는다
      KMA_APIHUB_RPS: ${KMA_APIHUB_RPS:-0.5}
      # 공공데이터포털 인증키 — 이 컨테이너에만. 비면 조회하지 않는다. apis.data.go.kr 호스트 한도 하나를 세 잡이 나눠 쓴다
      # (ADR-022 해양수산부 선박운항정보 PORT-MIS · ADR-023 해양교통안전공단 실시간 해양교통정보 · 해양수산부 격자4단계 WFS)
      DATA_GO_KR_SERVICE_KEY: ${DATA_GO_KR_SERVICE_KEY:-}
      HTTP_USER_AGENT: ${HTTP_USER_AGENT:-wakeline-dev/0.2}
      # 관심 지역 adsb_fi 먼저 · adsb_lol 폴백(계약 v5 §G25). 운영 설정(Redis wakeline:settings — api 가 DB 에서 미러)이 있으면 그 값이 먼저다
      AIRCRAFT_PROVIDERS: ${AIRCRAFT_PROVIDERS:-adsb_fi,adsb_lol,opensky}
      REGION_CENTER: ${REGION_CENTER:-36.5,127.8}
      REGION_RADIUS_NM: ${REGION_RADIUS_NM:-250}
      REGION_POLL_S: ${REGION_POLL_S:-10}
      GLOBAL_POLL_S: ${GLOBAL_POLL_S:-120}
      SIGMET_POLL_S: ${SIGMET_POLL_S:-300}
      RADAR_POLL_S: ${RADAR_POLL_S:-60}
      METAR_POLL_S: ${METAR_POLL_S:-600}
      RAW_DIR: /data/raw
      FIXTURES_DIR: /app/fixtures
      SCHEMAS_DIR: /app/schemas
      # environment 가 env_file 보다 우선한다 — 셸의 WAKELINE_FIXTURE_MODE 가 api 와 collector 에 똑같이 전달되도록 여기서도 지정
      WAKELINE_FIXTURE_MODE: ${WAKELINE_FIXTURE_MODE:-0}
    volumes:
      - raw:/data/raw
    depends_on:
      redis: { condition: service_healthy }
      db: { condition: service_healthy }
      # 스키마(ingest 테이블)는 migrate 가 만든다. api 건강에 묶지 않는다(R-78): api 가 크래시 루프여도 수집·원천 보관·DB 기록은 기동·재생성된다
      # (api 는 소비자 그룹을 스트림 처음부터 만들어 먼저 발행된 엔트리도 읽는다).
      migrate: { condition: service_completed_successfully }
    deploy:
      resources:
        limits: { memory: 512m, pids: 256 }
    networks:
      wakeline: { ipv4_address: "${WAKELINE_NET_PREFIX:-10.77.0}.40" }
      egress: {}                                   # 외부 공급자 호출(OpenSky·adsb.lol·AWC·기상청 …)
    healthcheck:
      # 계약 §8: 관심 지역 작업의 heartbeat(wakeline:collector.region_at)가 90 s 안이면 정상 — 프로세스는 살아 있지만 수집이 멈춘 상태를 잡는다(REL-20)
      test: ["CMD", "python", "-m", "wakeline_collector.health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 5s

  ais:
    # 선박 AIS 수신(ADR-014): aisstream.io 에 구역마다 WebSocket 하나(최대 3, 부록 B — 운영값 2개)를 계속 열어 두고 받은 메시지를 10 s 마다 wakeline:ships 로 XADD 한다.
    # 항공기 폴링(collector)과 이벤트 루프·메모리를 나누는 격벽이다 — 푸시 폭주·재연결이 항공기 수집을 굶기지 않는다.
    # 최소 권한: DB 비밀번호 없음(DB 에 쓰지 않는다), Redis 는 wakeline_ais(wakeline:ships · wakeline:ais:* 쓰기, 설정 읽기 전용),
    #   외부 키는 aisstream 키 하나. 이미지는 collector 와 같고 진입점만 다르다(이미지 ENTRYPOINT 를 바꾼다 — command 로는 인자만 붙는다).
    image: wakeline-collector:local
    build: *collector_build
    <<: *hardened
    init: true                                   # PID 1 = tini: SIGTERM 전달·좀비 회수
    # SIGTERM 뒤 연결 닫기 4 s + 큐 정리 + 발행 루프 1 s + 마지막 발행 3 s ≈ 8 s 넘음(ais/main.py) — 기본 10 s 는 여유가 없다
    stop_grace_period: 20s
    entrypoint: ["python", "-m", "wakeline_collector.ais"]
    tmpfs: ["/tmp:size=16m"]
    environment:
      TZ: UTC
      REDIS_HOST: redis
      REDIS_USERNAME: wakeline_ais                 # 계약 v2 §C
      REDIS_PASSWORD: ${REDIS_AIS_PASSWORD:?REDIS_AIS_PASSWORD 가 .env 에 없습니다 — make init}
      # 사용자가 .env 에 저장한 이름(aisstream_key)을 그대로 읽어 이 컨테이너에서만 AISSTREAM_API_KEY 로 넘긴다. 없으면 빈 값(수신 안 함).
      AISSTREAM_API_KEY: ${aisstream_key:-}
      AIS_BBOXES: ${AIS_BBOXES:-18,105,46,150}     # lat1,lon1,lat2,lon2; ';' 로 여러 상자, '|' 로 구역별 연결(최대 3). 런타임에는 wakeline:settings.ais_bboxes 가 덮어쓴다
      HTTP_USER_AGENT: ${HTTP_USER_AGENT:-wakeline-dev/0.2}
      FIXTURES_DIR: /app/fixtures
      SCHEMAS_DIR: /app/schemas
      WAKELINE_FIXTURE_MODE: ${WAKELINE_FIXTURE_MODE:-0}
    depends_on:
      # api 건강에 묶지 않는다(R-78): api 는 wakeline:ships 소비자 그룹을 스트림 처음부터 만들므로 먼저 발행한 정적 정보 묶음도 읽는다.
      redis: { condition: service_healthy }
    deploy:
      resources:
        limits: { memory: 256m, pids: 128 }
    networks:
      wakeline: {}
      egress: {}                                   # aisstream.io WebSocket
    healthcheck:
      # 계약 v2 §B1: 마지막 메시지 120 s 안, 또는 공백(gap)이 열린 채 재연결 중이면 정상(끊김은 화면이 공백으로 보인다)
      test: ["CMD", "python", "-m", "wakeline_collector.ais.health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 5s

  redis:
    image: redis:8-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    <<: *hardened
    init: true                                   # api 와 같은 이유
    user: "999:1000"                           # 이미지의 redis 사용자. 처음부터 비root 라 엔트리포인트의 권한 강하가 필요 없다
    entrypoint: ["sh", "/etc/redis/start.sh"]  # ACL 사용자 생성 후 redis-server 실행(비밀번호는 명령행이 아니라 환경변수로)
    tmpfs: ["/tmp:size=1m"]                      # start.sh 의 ACL 파일(비밀번호 해시만, 0600 — redis-server 에는 --aclfile 경로만 넘긴다)
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD 가 .env 에 없습니다 — make init}   # default(관리) — 헬스체크·운영 redis-cli 전용
      REDIS_API_PASSWORD: ${REDIS_API_PASSWORD:?REDIS_API_PASSWORD 가 .env 에 없습니다 — make init}
      REDIS_COLLECTOR_PASSWORD: ${REDIS_COLLECTOR_PASSWORD:?REDIS_COLLECTOR_PASSWORD 가 .env 에 없습니다 — make init}
      REDIS_AIS_PASSWORD: ${REDIS_AIS_PASSWORD:?REDIS_AIS_PASSWORD 가 .env 에 없습니다 — make init}
    volumes:
      - ./redis/redis.conf:/etc/redis/redis.conf:ro
      - ./redis/start.sh:/etc/redis/start.sh:ro
      - redis_data:/data
    deploy:
      resources:
        limits: { memory: 512m, pids: 128 }    # maxmemory 256mb + AOF 재작성 fork 여유
    networks:
      wakeline: { ipv4_address: "${WAKELINE_NET_PREFIX:-10.77.0}.50" }
    healthcheck:
      # 비밀번호를 명령행(-a)에 두지 않는다: redis-cli 는 REDISCLI_AUTH 환경변수를 읽는다
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  db:
    # R-63 · ADR-004 재결정(2026-09-30): 직접 빌드한 이미지(infra/db/Dockerfile) — 공식 postgres:18-trixie(다이제스트 고정 · Dependabot /infra/db) +
    #   PGDG PostGIS 3.6 · gosu 없음 · postgres(999)로 실행. 이전 imresamu/postgis:18-3.6 은 2026-02 이후 재빌드가 없어 CVE 가 쌓였다.
    #   같은 Debian 13 · 같은 메이저 18 · PostGIS 3.6 이라 기존 볼륨 그대로. PostGIS 부 버전이 오르면 한 번 `make db-postgis-update`.
    build: { context: ./db }
    image: wakeline-db:local
    read_only: true
    tmpfs: ["/var/run/postgresql", "/tmp"]
    # R-24(ADR-017 §4): 기본값(체크포인트 5분·WAL 1GB·압축 없음)이면 WAL 의 약 86 % 가 전체 페이지 이미지였다(약 16 GB/일).
    # 체크포인트 15분·WAL 상한 2GB·WAL 압축(pglz)·공유 버퍼 256MB(메모리 한도 1g). 대가: 비정상 종료 뒤 복구 재생이 최대 15분 분량. 되돌리기: 이 줄 삭제
    command: ["postgres", "-c", "checkpoint_timeout=15min", "-c", "max_wal_size=2GB", "-c", "wal_compression=on", "-c", "shared_buffers=256MB"]
    # 이미지가 처음부터 postgres(999)로 돈다(USER — 엔트리포인트의 root → gosu 경로 없음) — 추가 권한이 필요 없다(이전: CHOWN · DAC_OVERRIDE · FOWNER · SETGID · SETUID)
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    logging: *logging
    environment:
      POSTGRES_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD 가 .env 에 없습니다 — make init}
      DB_MIGRATOR_PASSWORD: ${DB_MIGRATOR_PASSWORD:?DB_MIGRATOR_PASSWORD 가 .env 에 없습니다 — make init}
      DB_API_PASSWORD: ${DB_API_PASSWORD:?DB_API_PASSWORD 가 .env 에 없습니다 — make init}
      DB_COLLECTOR_PASSWORD: ${DB_COLLECTOR_PASSWORD:?DB_COLLECTOR_PASSWORD 가 .env 에 없습니다 — make init}
      # SEC-R3: 슈퍼유저는 로컬 소켓 전용(infra/db/init/02-superuser-local-only.sh). 새 데이터 디렉터리에만 적용된다 —
      # 기존 볼륨은 tools/db-superuser-local-only.sh 로 한 번 적용한다. 헬스체크·운영 psql 은 로컬 소켓이라 영향 없음.
      WAKELINE_PG_SUPERUSER_TCP: reject
    volumes:
      - db_data:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    deploy:
      resources:
        limits: { memory: 1g, pids: 512 }
    networks:
      wakeline: { ipv4_address: "${WAKELINE_NET_PREFIX:-10.77.0}.60" }
    restart: unless-stopped
    shm_size: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wakeline"]
      interval: 5s
      timeout: 3s
      retries: 20

# 네트워크 분리(R-64 · R-77 · ADR-017 §4) — web·api·migrate·db·redis 는 망이 인터넷을 막는다(internal). '외부 호출은 collector·ais 만'에서
# edge 는 예외다: 게시 포트는 internal 망에 둘 수 없어 public 이 일반 bridge(NAT)이고, Docker Desktop 은 bridge 의 masquerade 끄기로도
# 막지 않았다(실측) — edge 는 설정(upstream api·web 뿐, resolver 없음)으로 외부에 나가지 않는다(infra/tests/test_edge_policy.py).
#   public   edge 만. 게시 포트(127.0.0.1:${WAKELINE_PORT}) 경로.
#   wakeline ADR 의 internal 망: internal: true(게이트웨이·NAT 없음 — 인터넷에 닿지 않는다). 모든 서비스가 서로 닿는 유일한 망이고 고정 IP 는 여기 있다
#            (edge .10 = api 의 WAKELINE_TRUSTED_PROXY, api .30 = make bench). web·api·migrate·db·redis 는 이 망에만 있다.
#            망 구성(internal 여부 등)이 바뀌는 배포는 `make down` 뒤 `make up` 으로 전부 다시 만든다(R-64 후속): compose 가 망만 다시 만들면
#            다시 만들지 않은 컨테이너는 고정 IP(ipv4_address) 없이 동적 주소로 다시 붙고, 뒤의 `up -d` 도 고치지 않는다(실측).
#   egress   collector·ais 만. 인터넷(외부 공급자) 경로.
networks:
  public:
    driver: bridge
  wakeline:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: ${WAKELINE_NET_PREFIX:-10.77.0}.0/24
  egress:
    driver: bridge

volumes:
  raw: {}
  redis_data: {}
  db_data: {}
