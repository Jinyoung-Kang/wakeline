# SkyWx 로컬 스택 — 6 컨테이너. 공개 포트는 edge(127.0.0.1:8700) 하나뿐이다.
name: skywx

x-hardened: &hardened
  read_only: true
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped

services:
  edge:
    image: nginx:1.27-alpine
    ports: ["127.0.0.1:8700:8700"]   # 8080 은 SmartCollab 이 사용 — SkyWx 는 8700
    volumes:
      - ./edge/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./edge/proxy_headers.conf:/etc/nginx/proxy_headers.conf:ro
    depends_on:
      web: { condition: service_healthy }
      api: { condition: service_healthy }
    networks:
      skywx: { ipv4_address: 10.77.0.10 }
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8700/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6

  web:
    build: ../apps/web
    <<: *hardened
    tmpfs: ["/tmp"]
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      API_INTERNAL_URL: http://api:8000       # 서버 컴포넌트 전용. NEXT_PUBLIC_ 변수는 없다.
    expose: ["3000"]
    networks:
      skywx: { ipv4_address: 10.77.0.20 }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 10

  api:
    build: ../apps/api
    <<: *hardened
    tmpfs: ["/tmp"]
    environment:
      TZ: UTC
      SPRING_THREADS_VIRTUAL_ENABLED: "true"
      MANAGEMENT_SERVER_PORT: "9000"
      DB_HOST: db
      DB_NAME: skywx
      DB_API_PASSWORD: ${DB_API_PASSWORD}
      DB_MIGRATOR_PASSWORD: ${DB_MIGRATOR_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      SKYWX_TRUSTED_PROXY: 10.77.0.10          # edge 만 X-Forwarded-For 를 말할 수 있다
      SKYWX_REGION_CENTER: ${REGION_CENTER:-36.5,127.8}
      SKYWX_REGION_RADIUS_NM: ${REGION_RADIUS_NM:-250}
      SKYWX_OPS_SESSION_TTL_H: ${OPS_SESSION_TTL_H:-8}
      SKYWX_PUBLIC_RATE_LIMIT_PER_MIN: ${PUBLIC_RATE_LIMIT_PER_MIN:-120}
      SKYWX_WS_MAX_CONN: ${WS_MAX_CONN:-200}
      SKYWX_WS_MAX_CONN_PER_IP: ${WS_MAX_CONN_PER_IP:-5}
      SKYWX_FIXTURE_MODE: ${SKYWX_FIXTURE_MODE:-0}
    expose: ["8000", "9000"]
    depends_on:
      redis: { condition: service_healthy }
      db: { condition: service_healthy }
    deploy:
      resources:
        limits: { memory: 1g }
    networks:
      skywx: { ipv4_address: 10.77.0.30 }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s

  collector:
    build:
      context: ..
      dockerfile: apps/collector/Dockerfile
    <<: *hardened
    tmpfs: ["/tmp"]
    env_file: ../.env                          # OPENSKY_* 등 외부 키는 이 컨테이너에만 들어간다
    environment:
      TZ: UTC
      DB_HOST: db
      DB_NAME: skywx
      REDIS_HOST: redis
      RAW_DIR: /data/raw
      FIXTURES_DIR: /app/fixtures
      SCHEMAS_DIR: /app/schemas
    volumes:
      - raw:/data/raw
    depends_on:
      redis: { condition: service_healthy }
      db: { condition: service_healthy }
      api: { condition: service_healthy }      # Flyway 가 ingest 테이블을 만든 뒤에 시작
    deploy:
      resources:
        limits: { memory: 512m }
    networks:
      skywx: { ipv4_address: 10.77.0.40 }

  redis:
    image: redis:8-alpine
    command: ["redis-server", "/etc/redis/redis.conf", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - ./redis/redis.conf:/etc/redis/redis.conf:ro
      - redis_data:/data
    networks:
      skywx: { ipv4_address: 10.77.0.50 }
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  db:
    image: imresamu/postgis:18-3.6              # 공식 postgis/postgis 18-3.6 은 amd64 뿐이라 arm64 네이티브 빌드를 쓴다 (ADR-004)
    environment:
      POSTGRES_PASSWORD: ${DB_ROOT_PASSWORD}
      DB_MIGRATOR_PASSWORD: ${DB_MIGRATOR_PASSWORD}
      DB_API_PASSWORD: ${DB_API_PASSWORD}
      DB_COLLECTOR_PASSWORD: ${DB_COLLECTOR_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks:
      skywx: { ipv4_address: 10.77.0.60 }
    restart: unless-stopped
    shm_size: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d skywx"]
      interval: 5s
      timeout: 3s
      retries: 20

networks:
  skywx:
    driver: bridge
    ipam:
      config:
        - subnet: 10.77.0.0/24

volumes:
  raw: {}
  redis_data: {}
  db_data: {}
