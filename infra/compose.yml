# SkyWx 로컬 스택 — 6 컨테이너. 공개 포트는 edge(127.0.0.1:${SKYWX_PORT:-8700}) 하나뿐이다.
# 같은 파일로 격리된 E2E·데모 스택도 띄운다: -p skywx-e2e, SKYWX_PORT=8701, SKYWX_NET_PREFIX=10.78.0 (Makefile e2e/demo).
# 프로젝트가 다르면 컨테이너·볼륨·네트워크가 분리되어 개발 DB 에 fixture 데이터가 섞이지 않는다.
#
# 컨테이너 권한(SEC-4): 모든 컨테이너가 no-new-privileges 이고 cap_drop ALL 이다. db 를 뺀 전부가 비root·read-only 루트 FS 다.
#   db 만 엔트리포인트가 데이터 디렉터리 소유권을 맞춘 뒤 postgres(999)로 내려가므로 그 5개 권한(CHOWN·DAC_OVERRIDE·FOWNER·SETGID·SETUID)을 남긴다
#   — postgres 프로세스 자체는 권한 0 으로 돈다(infra/tests/db_hardening_test.sh).
# 제3자 이미지는 태그+다이제스트로 고정한다(Dependabot docker-compose 가 매주 갱신 PR).
# Redis 는 서비스별 ACL 사용자(계약 §6, infra/redis/start.sh)로 접속한다 — api·collector 는 관리용 default 비밀번호를 모른다.
name: skywx

x-hardened: &hardened
  read_only: true
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped

services:
  edge:
    # 비root nginx(uid 101). 1.27 계열은 2025-06 이후 재빌드가 없어 현재 stable(1.30) 을 쓴다.
    image: nginxinc/nginx-unprivileged:1.30-alpine@sha256:4714e0b1b2577eaa1a6131d07c958b67f0eb68e6d0521e90c6e5287db8cf0bc5
    <<: *hardened
    user: "101:101"
    tmpfs: ["/tmp:size=64m"]                        # pid · 프록시 임시 파일(nginx.conf)
    ports: ["127.0.0.1:${SKYWX_PORT:-8700}:8700"]   # 8080 은 SmartCollab 이 사용 — SkyWx 는 8700(E2E 8701)
    environment:
      NGINX_ENTRYPOINT_QUIET_LOGS: "1"
    volumes:
      - ./edge/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./edge/proxy_headers.conf:/etc/nginx/proxy_headers.conf:ro
      - ./edge/security_headers.conf:/etc/nginx/security_headers.conf:ro
    depends_on:
      web: { condition: service_healthy }
      api: { condition: service_healthy }
    deploy:
      resources:
        limits: { memory: 256m, pids: 256 }
    networks:
      skywx: { ipv4_address: "${SKYWX_NET_PREFIX:-10.77.0}.10" }
    healthcheck:
      # Host 허용 목록(nginx.conf)에 127.0.0.1 이 있으므로 421 이 아니라 api 의 /healthz 까지 간다
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8700/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6

  web:
    image: skywx-web:local
    build: ../apps/web
    <<: *hardened
    tmpfs: ["/tmp"]
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      API_INTERNAL_URL: http://api:8000       # 서버 컴포넌트 전용. NEXT_PUBLIC_ 변수는 없다.
    expose: ["3000"]
    deploy:
      resources:
        limits: { memory: 512m, pids: 256 }
    networks:
      skywx: { ipv4_address: "${SKYWX_NET_PREFIX:-10.77.0}.20" }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 10

  migrate:
    # Flyway 를 한 번 실행하고 끝난다. DDL 권한 비밀번호(DB_MIGRATOR_PASSWORD)는 이 컨테이너에만 주입한다.
    image: skywx-api:local
    build: ../apps/api
    <<: *hardened
    restart: "no"
    tmpfs: ["/tmp"]
    command: ["--migrate"]
    environment:
      TZ: UTC
      DB_HOST: db
      DB_NAME: skywx
      DB_API_PASSWORD: ${DB_API_PASSWORD}
      DB_MIGRATOR_PASSWORD: ${DB_MIGRATOR_PASSWORD}
      REDIS_HOST: redis
      # api 와 같은 ACL 사용자(관리용 default 비밀번호는 주지 않는다)
      REDIS_USERNAME: skywx_api
      REDIS_PASSWORD: ${REDIS_API_PASSWORD:?REDIS_API_PASSWORD 가 .env 에 없습니다 — make init}
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks:
      skywx: {}

  api:
    image: skywx-api:local
    build: ../apps/api
    <<: *hardened
    tmpfs: ["/tmp"]
    # 종료 순서(소비 중지 → 트랙 flush → WS going_away)가 끝나도록 docker 기본 10 s 대신 30 s 를 준다(REL-15)
    stop_grace_period: 30s
    environment:
      TZ: UTC
      SPRING_THREADS_VIRTUAL_ENABLED: "true"
      MANAGEMENT_SERVER_PORT: "9000"
      DB_HOST: db
      DB_NAME: skywx
      DB_API_PASSWORD: ${DB_API_PASSWORD}
      REDIS_HOST: redis
      REDIS_USERNAME: skywx_api                 # 계약 §6: 키 skywx:* · rl:* 만, 위험 명령 없음
      REDIS_PASSWORD: ${REDIS_API_PASSWORD:?REDIS_API_PASSWORD 가 .env 에 없습니다 — make init}
      SKYWX_TRUSTED_PROXY: ${SKYWX_NET_PREFIX:-10.77.0}.10   # edge 만 X-Forwarded-For 를 말할 수 있다
      # WebSocket Origin 허용 목록(계약 §1). Host 에서 유도하지 않는다 — DNS rebinding 방어(SEC-7). 격리 스택은 SKYWX_PORT=8701 로 맞춰진다.
      SKYWX_ALLOWED_ORIGINS: http://localhost:${SKYWX_PORT:-8700},http://127.0.0.1:${SKYWX_PORT:-8700}
      SKYWX_REGION_CENTER: ${REGION_CENTER:-36.5,127.8}
      SKYWX_REGION_RADIUS_NM: ${REGION_RADIUS_NM:-250}
      SKYWX_OPS_SESSION_TTL_H: ${OPS_SESSION_TTL_H:-8}
      SKYWX_PUBLIC_RATE_LIMIT_PER_MIN: ${PUBLIC_RATE_LIMIT_PER_MIN:-120}
      SKYWX_WS_MAX_CONN: ${WS_MAX_CONN:-200}
      SKYWX_WS_MAX_CONN_PER_IP: ${WS_MAX_CONN_PER_IP:-5}
      SKYWX_FIXTURE_MODE: ${SKYWX_FIXTURE_MODE:-0}
    expose: ["8000", "9000"]
    depends_on:
      redis: { condition: service_healthy }
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    deploy:
      resources:
        limits: { memory: 1g, pids: 1024 }
    networks:
      skywx: { ipv4_address: "${SKYWX_NET_PREFIX:-10.77.0}.30" }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s

  collector:
    image: skywx-collector:local
    build:
      context: ..
      dockerfile: apps/collector/Dockerfile
    <<: *hardened
    tmpfs: ["/tmp"]
    # 최소 권한: .env 전체(env_file)를 넘기지 않고 collector 가 쓰는 값만 명시한다.
    # DB root·마이그레이터 비밀번호, 운영자 초기 비밀번호는 이 컨테이너에 들어오지 않는다. 외부 키는 이 컨테이너에만 들어간다.
    environment:
      TZ: UTC
      DB_HOST: db
      DB_NAME: skywx
      DB_COLLECTOR_PASSWORD: ${DB_COLLECTOR_PASSWORD}
      REDIS_HOST: redis
      REDIS_USERNAME: skywx_collector           # 계약 §6: 수집기 키만, 세션·요청 제한·DLQ 접근 불가, 설정은 읽기 전용
      REDIS_PASSWORD: ${REDIS_COLLECTOR_PASSWORD:?REDIS_COLLECTOR_PASSWORD 가 .env 에 없습니다 — make init}
      OPENSKY_CLIENT_ID: ${OPENSKY_CLIENT_ID:-}
      OPENSKY_CLIENT_SECRET: ${OPENSKY_CLIENT_SECRET:-}
      KMA_APIHUB_KEY: ${KMA_APIHUB_KEY:-}
      HTTP_USER_AGENT: ${HTTP_USER_AGENT:-skywx-dev/0.2}
      AIRCRAFT_PROVIDERS: ${AIRCRAFT_PROVIDERS:-adsb_lol,adsb_fi,opensky}
      REGION_CENTER: ${REGION_CENTER:-36.5,127.8}
      REGION_RADIUS_NM: ${REGION_RADIUS_NM:-250}
      REGION_POLL_S: ${REGION_POLL_S:-10}
      GLOBAL_POLL_S: ${GLOBAL_POLL_S:-120}
      SIGMET_POLL_S: ${SIGMET_POLL_S:-300}
      RADAR_POLL_S: ${RADAR_POLL_S:-60}
      METAR_POLL_S: ${METAR_POLL_S:-600}
      RAW_DIR: /data/raw
      FIXTURES_DIR: /app/fixtures
      SCHEMAS_DIR: /app/schemas
      # environment 가 env_file 보다 우선한다 — 셸의 SKYWX_FIXTURE_MODE 가 api 와 collector 에 똑같이 전달되도록 여기서도 지정
      SKYWX_FIXTURE_MODE: ${SKYWX_FIXTURE_MODE:-0}
    volumes:
      - raw:/data/raw
    depends_on:
      redis: { condition: service_healthy }
      db: { condition: service_healthy }
      api: { condition: service_healthy }      # Flyway 가 ingest 테이블을 만든 뒤에 시작
    deploy:
      resources:
        limits: { memory: 512m, pids: 256 }
    networks:
      skywx: { ipv4_address: "${SKYWX_NET_PREFIX:-10.77.0}.40" }
    healthcheck:
      # 계약 §8: 관심 지역 작업의 heartbeat(skywx:collector.region_at)가 90 s 안이면 정상 — 프로세스는 살아 있지만 수집이 멈춘 상태를 잡는다(REL-20)
      test: ["CMD", "python", "-m", "skywx_collector.health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 5s

  redis:
    image: redis:8-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    <<: *hardened
    user: "999:1000"                           # 이미지의 redis 사용자. 처음부터 비root 라 엔트리포인트의 권한 강하가 필요 없다
    entrypoint: ["sh", "/etc/redis/start.sh"]  # ACL 사용자 생성 후 redis-server 실행(비밀번호는 명령행이 아니라 환경변수로)
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}                 # default(관리) — 헬스체크·운영 redis-cli 전용
      REDIS_API_PASSWORD: ${REDIS_API_PASSWORD:?REDIS_API_PASSWORD 가 .env 에 없습니다 — make init}
      REDIS_COLLECTOR_PASSWORD: ${REDIS_COLLECTOR_PASSWORD:?REDIS_COLLECTOR_PASSWORD 가 .env 에 없습니다 — make init}
    volumes:
      - ./redis/redis.conf:/etc/redis/redis.conf:ro
      - ./redis/start.sh:/etc/redis/start.sh:ro
      - redis_data:/data
    deploy:
      resources:
        limits: { memory: 512m, pids: 128 }    # maxmemory 256mb + AOF 재작성 fork 여유
    networks:
      skywx: { ipv4_address: "${SKYWX_NET_PREFIX:-10.77.0}.50" }
    healthcheck:
      # 비밀번호를 명령행(-a)에 두지 않는다: redis-cli 는 REDISCLI_AUTH 환경변수를 읽는다
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  db:
    image: imresamu/postgis:18-3.6@sha256:b5766ee720aca09c61b9a868abefbf273348a4b90ad4cf146b4f8c9ac85d48e4   # 공식 postgis/postgis 18-3.6 은 amd64 뿐이라 arm64 네이티브 빌드를 쓴다 (ADR-004)
    read_only: true
    tmpfs: ["/var/run/postgresql", "/tmp"]
    cap_drop: ["ALL"]
    # 엔트리포인트(root)가 데이터 디렉터리 소유권·권한을 맞추고 gosu 로 postgres(999)가 되는 데 필요한 것만
    cap_add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID"]
    security_opt: ["no-new-privileges:true"]
    environment:
      POSTGRES_PASSWORD: ${DB_ROOT_PASSWORD}
      DB_MIGRATOR_PASSWORD: ${DB_MIGRATOR_PASSWORD}
      DB_API_PASSWORD: ${DB_API_PASSWORD}
      DB_COLLECTOR_PASSWORD: ${DB_COLLECTOR_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    deploy:
      resources:
        limits: { memory: 1g, pids: 512 }
    networks:
      skywx: { ipv4_address: "${SKYWX_NET_PREFIX:-10.77.0}.60" }
    restart: unless-stopped
    shm_size: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d skywx"]
      interval: 5s
      timeout: 3s
      retries: 20

networks:
  skywx:
    driver: bridge
    ipam:
      config:
        - subnet: ${SKYWX_NET_PREFIX:-10.77.0}.0/24

volumes:
  raw: {}
  redis_data: {}
  db_data: {}
