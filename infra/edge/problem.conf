# edge 가 만든 오류의 problem+json 응답(nginx.conf 의 @problem_* — QA 2026-10 기능 개선 제안 9).
# add_header 상속 함정: 이 location 이 add_header(Retry-After)를 쓰면 서버 수준의 보안 헤더를 물려받지 않는다 — 여기서 다시 넣는다.
default_type application/problem+json;
include /etc/nginx/security_headers.conf;
add_header Cache-Control "no-store" always;
