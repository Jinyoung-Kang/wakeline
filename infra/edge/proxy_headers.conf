# 모든 location 이 include 하는 공통 프록시 헤더.
# X-Forwarded-For 는 클라이언트가 보낸 값을 버리고 실제 접속 주소로 덮어쓴다(위조 차단). Forwarded/X-Forwarded-Host 는 비운다.
proxy_set_header Host $http_host;   # 포트 포함 — WebSocket same-origin 검사(Origin ↔ Host)가 포트까지 비교한다
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host "";
proxy_set_header Forwarded "";
