# 모든 location 이 include 하는 공통 프록시 헤더.
# X-Forwarded-For 는 클라이언트가 보낸 값을 버리고 실제 접속 주소로 덮어쓴다(위조 차단). Forwarded/X-Forwarded-Host 는 비운다.
proxy_set_header Host $http_host;   # 포트 포함. edge 의 Host 허용 목록(nginx.conf)을 통과한 값만 여기까지 온다 — WS Origin 은 api 가 명시 목록(WAKELINE_ALLOWED_ORIGINS)으로 검사한다
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host "";
proxy_set_header Forwarded "";
# 요청 상관 id(R-49): api 는 edge 에서 온 X-Request-Id 를 그대로 쓴다(RequestIdFilter) — 클라이언트 값은 버리고 edge 의 $request_id 로 덮어써
# edge 접근 로그(log_format wakeline)와 api 로그·오류 본문의 request_id 가 같은 값이 되게 한다.
proxy_set_header X-Request-Id $request_id;
