# SkyWx edge — 유일한 공개 진입점(호스트 127.0.0.1:8700). XFF 덮어쓰기 · IP당 요청 제한(1차) · 보안 헤더 · 압축.
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events { worker_connections 2048; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /dev/stdout;
    server_tokens off;
    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;
    client_max_body_size 1m;
    client_body_timeout 10s;
    client_header_timeout 10s;

    # IP당 10 r/s (burst 30). api 의 Lua 제한(분당 120)이 2차.
    limit_req_zone  $binary_remote_addr zone=perip:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=perip_conn:10m;
    limit_req_status 429;
    limit_conn_status 429;

    gzip on;
    gzip_types application/json application/geo+json application/problem+json text/css application/javascript text/plain image/svg+xml;
    gzip_min_length 1024;

    map $http_upgrade $connection_upgrade { default upgrade; '' close; }

    # 서비스 이름으로 찾는다(고정 IP 는 api 의 신뢰 프록시 판정에만 쓴다) — 같은 설정으로 격리된 E2E 스택도 동작
    upstream web { server web:3000; keepalive 16; }
    upstream api { server api:8000; keepalive 32; }

    server {
        listen 8700;
        server_name _;

        include /etc/nginx/security_headers.conf;

        # 주의: nginx 는 location 에 proxy_set_header 가 하나라도 있으면 상위 블록의 proxy_set_header 를 전부 무시한다.
        # 그래서 공통 헤더(XFF 덮어쓰기 포함)는 proxy_headers.conf 로 두고 모든 location 에서 include 한다.
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;

        location = /healthz {
            include /etc/nginx/proxy_headers.conf;
            proxy_pass http://api/healthz;
            access_log off;
        }

        location /api/ {
            limit_req zone=perip burst=30 nodelay;
            include /etc/nginx/proxy_headers.conf;
            proxy_set_header Connection "";
            proxy_pass http://api;
        }

        location /ws/ {
            limit_conn perip_conn 10;
            include /etc/nginx/proxy_headers.conf;
            proxy_pass http://api;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        # actuator 는 내부 포트(9000)에만 있다 — 여기로는 절대 노출하지 않는다.
        location /actuator { return 404; }

        location ^~ /_next/static/ {
            include /etc/nginx/proxy_headers.conf;
            proxy_set_header Connection "";
            proxy_pass http://web;
            proxy_hide_header Cache-Control;                 # 상류 값을 숨기고 하나만 내보낸다(중복 방지)
            include /etc/nginx/security_headers.conf;       # add_header 상속 함정
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        location / {
            limit_req zone=perip burst=60 nodelay;
            include /etc/nginx/proxy_headers.conf;
            proxy_set_header Connection "";
            proxy_pass http://web;
        }
    }
}
