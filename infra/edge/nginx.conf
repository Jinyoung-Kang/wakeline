# Wakeline edge — 유일한 공개 진입점(호스트 127.0.0.1:8700). Host 허용 목록 · XFF 덮어쓰기 · IP당 요청 제한(1차) · 보안 헤더 · 압축.
# 비root 이미지(nginxinc/nginx-unprivileged, uid 101)가 read-only 루트 FS · cap_drop ALL 로 돈다(compose.yml):
# pid 와 모든 임시 파일은 tmpfs(/tmp)에 둔다. 이미지 기본값(/var/cache/nginx/*)은 읽기 전용이라 기동이 실패한다.
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events { worker_connections 2048; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    # 기본 combined 형식 + 요청 id(R-49, api 로그의 [rid:…] 와 같은 값) · 처리 시간 · 상류 응답 시간
    log_format    wakeline '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent '
                           '"$http_referer" "$http_user_agent" rid=$request_id rt=$request_time urt=$upstream_response_time';
    access_log    /dev/stdout wakeline;
    server_tokens off;
    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;
    client_max_body_size 1m;
    client_body_timeout 10s;
    client_header_timeout 10s;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;
    # 응답 하나가 임시 파일로 쓸 수 있는 상한 — tmpfs(64 MB, 메모리 상한에 포함)를 큰 응답 몇 개가 다 채우지 않게. 넘는 부분은 상류에서 동기로 받는다.
    proxy_max_temp_file_size 16m;

    # IP당 10 r/s (burst 30). api 의 Lua 제한(분당 120)이 2차.
    limit_req_zone  $binary_remote_addr zone=perip:10m rate=10r/s;
    # WebSocket 핸드셰이크(업그레이드 요청) 전용 — 재접속 폭주를 끊는다. /api/ 와 버킷을 나누어 페이지 로드의 REST 호출이 WS 연결을 막지 않게 한다.
    limit_req_zone  $binary_remote_addr zone=perip_ws:10m rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=perip_conn:10m;
    limit_req_status 429;
    limit_conn_status 429;

    gzip on;
    gzip_types application/json application/geo+json application/problem+json text/css application/javascript text/plain image/svg+xml;
    gzip_min_length 1024;

    map $http_upgrade $connection_upgrade { default upgrade; '' close; }

    # 서비스 이름으로 찾는다(고정 IP 는 api 의 신뢰 프록시 판정에만 쓴다) — 같은 설정으로 격리된 E2E 스택도 동작
    upstream web { server web:3000; keepalive 16; }
    upstream api { server api:8000; keepalive 32; }

    # DNS rebinding 방어(SEC-7): Host 가 허용 목록(localhost · 127.0.0.1 · [::1]) 밖이면 앱에 닿지 않고 421 로 끝난다.
    # 공격자 도메인이 127.0.0.1 로 바뀌어도 브라우저는 Host 에 그 도메인을 보내므로 여기서 걸린다. Host 가 없는 요청(HTTP/1.0)도 여기로 온다.
    # server_name 은 포트를 보지 않는다 — 같은 설정으로 격리 E2E 스택(호스트 8701)과 컨테이너 헬스체크(127.0.0.1:8700)가 동작한다.
    server {
        listen 8700 default_server;
        server_name _;
        include /etc/nginx/security_headers.conf;
        return 421;
    }

    server {
        listen 8700;
        server_name localhost 127.0.0.1 [::1];

        include /etc/nginx/security_headers.conf;

        # 주의: nginx 는 location 에 proxy_set_header 가 하나라도 있으면 상위 블록의 proxy_set_header 를 전부 무시한다.
        # 그래서 공통 헤더(XFF 덮어쓰기 포함)는 proxy_headers.conf 로 두고 모든 location 에서 include 한다.
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;

        location = /healthz {
            include /etc/nginx/proxy_headers.conf;
            proxy_pass http://api/healthz;
            access_log off;
        }

        location /api/ {
            limit_req zone=perip burst=30 nodelay;
            include /etc/nginx/proxy_headers.conf;
            proxy_set_header Connection "";
            proxy_pass http://api;
        }

        location /ws/ {
            limit_req zone=perip_ws burst=10 nodelay;
            limit_conn perip_conn 10;
            include /etc/nginx/proxy_headers.conf;
            proxy_pass http://api;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 60s;                  # api 쪽으로 쓰기가 막힌 채 버티는 시간 상한(유휴 연결은 read_timeout 이 관리)
            proxy_buffering off;
        }

        # actuator 는 내부 포트(9000)에만 있다 — 여기로는 절대 노출하지 않는다.
        location /actuator { return 404; }

        location ^~ /_next/static/ {
            include /etc/nginx/proxy_headers.conf;
            proxy_set_header Connection "";
            proxy_pass http://web;
            proxy_hide_header Cache-Control;                 # 상류 값을 숨기고 하나만 내보낸다(중복 방지)
            include /etc/nginx/security_headers.conf;       # add_header 상속 함정
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        location / {
            limit_req zone=perip burst=60 nodelay;
            include /etc/nginx/proxy_headers.conf;
            proxy_set_header Connection "";
            proxy_pass http://web;
        }
    }
}
