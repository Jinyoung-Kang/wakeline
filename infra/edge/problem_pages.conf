# edge 가 직접 만든 오류의 problem+json 본문(RFC 9457 — api 와 같은 type · title · status · detail · code · request_id, QA 2026-10 기능 개선 제안 9).
# nginx.conf 의 두 server 가 include 하고, 각 location 의 error_page 가 여기로 보낸다. 이름 붙은 location(@…)이 아니라 internal URI 다 — 요청 줄을
# 해석하기 전에 난 오류(414 · NUL 400)는 이름 붙은 location 으로 넘기지 못한다(nginx: "empty URI in redirect to named location" → 500). 예전에는 nginx 기본 HTML 이라 클라이언트가 두 가지를 다뤄야 했다.
# code 는 api 와 같은 규칙(상태 이름 — ProblemJson.codeAndTitle), 429 만 api 의 요청 제한과 같은 RATE_LIMITED.
# instance(요청 경로)는 싣지 않는다 — nginx 는 JSON 이스케이프를 못 한다. request_id 는 접근 로그의 rid · api 의 X-Request-Id 와 같은 값(32자 16진).
location = /.edge-problem/400 { internal; include /etc/nginx/problem.conf; return 400 '{"type":"https://wakeline.invalid/problems/bad-request","title":"bad request","status":400,"detail":"malformed request (edge)","code":"BAD_REQUEST","request_id":"$request_id"}'; }
location = /.edge-problem/413 { internal; include /etc/nginx/problem.conf; return 413 '{"type":"https://wakeline.invalid/problems/content-too-large","title":"content too large","status":413,"detail":"request body over 1 MB (edge)","code":"CONTENT_TOO_LARGE","request_id":"$request_id"}'; }
location = /.edge-problem/414 { internal; include /etc/nginx/problem.conf; return 414 '{"type":"https://wakeline.invalid/problems/uri-too-long","title":"uri too long","status":414,"detail":"request URI over 8 KB (edge)","code":"URI_TOO_LONG","request_id":"$request_id"}'; }
# Retry-After: 양동이가 한 칸 차는 시간(10 r/s → 1 s)
location = /.edge-problem/429 { internal; include /etc/nginx/problem.conf; add_header Retry-After 1 always; return 429 '{"type":"https://wakeline.invalid/problems/rate-limited","title":"rate limited","status":429,"detail":"too many requests per IP (edge)","code":"RATE_LIMITED","request_id":"$request_id"}'; }
# 상류가 없음 · 답하지 않음 — api 가 저장소를 못 쓸 때(503)와 같은 Retry-After 10 s
location = /.edge-problem/502 { internal; include /etc/nginx/problem.conf; add_header Retry-After 10 always; return 502 '{"type":"https://wakeline.invalid/problems/bad-gateway","title":"bad gateway","status":502,"detail":"upstream unavailable (edge)","code":"BAD_GATEWAY","request_id":"$request_id"}'; }
location = /.edge-problem/503 { internal; include /etc/nginx/problem.conf; add_header Retry-After 10 always; return 503 '{"type":"https://wakeline.invalid/problems/service-unavailable","title":"service unavailable","status":503,"detail":"service unavailable (edge)","code":"SERVICE_UNAVAILABLE","request_id":"$request_id"}'; }
location = /.edge-problem/504 { internal; include /etc/nginx/problem.conf; add_header Retry-After 10 always; return 504 '{"type":"https://wakeline.invalid/problems/gateway-timeout","title":"gateway timeout","status":504,"detail":"upstream did not answer in time (edge)","code":"GATEWAY_TIMEOUT","request_id":"$request_id"}'; }
