# AWS 배포 전용 (infra/compose.aws.yml 이 /etc/nginx/edge.d/ 에 마운트, ADR-039)
# 앞단 Caddy 가 CloudFront 대역만 믿고 정한 클라이언트 IP 하나로 X-Forwarded-For 를 덮어써 보낸다.
# edge 게시 포트는 127.0.0.1 에만 열려 같은 호스트의 Caddy(와 SSM 관리자 터널)만 닿고, 그 연결은 도커 브리지 게이트웨이(사설 대역)에서 온다.
# realip 이 $remote_addr 를 그 값으로 바꾸므로 IP당 요청 · WS 제한과 api 의 IP 기준 제한이 방문자마다 따로 센다.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 127.0.0.1;
real_ip_header X-Forwarded-For;
